version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://backend:8000
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - AIR_GAP_MODE=true
      - MODEL_GATEWAY_URL=http://ollama:11434
    volumes:
      - ./backend:/app
      - chroma_data:/app/chroma_db

volumes:
  chroma_data:
